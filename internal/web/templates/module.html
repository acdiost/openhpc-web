{{define "module.html"}}
<!doctype html>
<html lang="{{.Language}}" data-theme="{{.Theme}}">
{{template "document-head" .}}
<body>
  <div class="app-shell" data-component="app-shell">
    {{template "app-sidebar" .}}
    <div class="main-area">
      {{template "app-topbar" .}}
      <main class="content module-content" data-module-path="{{.Module.Path}}">
        {{template "page-heading" .}}
        <section class="module-state panel">
          <span class="nav-icon icon-{{.Module.Icon}}" aria-hidden="true"></span>
          <div><h2>{{.Copy.ComingSoon}}</h2><p>{{.Copy.ComingSoonDetail}}</p></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
{{end}}
